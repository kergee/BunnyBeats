name: Build Tauri App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.6
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/frontend-checks.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  build:
    needs: checks
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64)
          - os: macos-latest
          # Intel Mac (x86_64), GitHub label: macos-15-intel
          - os: macos-15-intel
          - os: ubuntu-22.04
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true
          ref: ${{ env.RELEASE_TAG }}

      - name: Fetch Git LFS assets
        run: git lfs pull

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend and desktop build tools
        run: npm ci

      - name: Validate release version and input files
        run: npm run check:release

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci -- --locked
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "BunnyBeats ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: false
