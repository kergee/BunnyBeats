name: Desktop artifact checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/frontend-checks.yml
    with:
      ref: ${{ github.sha }}

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Fetch Git LFS assets
        run: git lfs pull

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend and desktop build tools
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build desktop installers
        run: npm run desktop:build -- --ci -- --locked

      - name: Test native PNG validation and file replacement
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: BunnyBeats-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
