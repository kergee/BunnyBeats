<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌曲管理 · BunnyBeats</title>
    <style>
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; max-width: 760px; }
      h1 { margin-bottom: 8px; }
      p { color: #555; }
      .row { display: grid; gap: 10px; margin: 14px 0; }
      label { font-size: 14px; font-weight: 600; }
      input, select, button { font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
      button { cursor: pointer; background: #111; color: #fff; border: none; }
      button.secondary { background: #f2f2f2; color: #111; border: 1px solid #ddd; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
      .check input { width: 18px; height: 18px; }
      .hint { font-size: 12px; color: #777; }
      .ok { color: #116329; }
      .err { color: #a31414; }
      .status { margin-top: 14px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>歌曲管理</h1>
    <p>选择 BunnyBeats 项目文件夹，添加音频、封面和歌词。</p>

    <div class="row">
      <button id="pickDir" class="secondary">1. 选择项目文件夹</button>
      <div class="hint">选择包含 songs.json 的文件夹；新文件夹会在保存时创建歌单。</div>
    </div>

    <div class="row">
      <label for="id">歌曲 ID（留空自动生成）</label>
      <input id="id" placeholder="my-song-1" />
      <label for="title">歌名</label>
      <input id="title" placeholder="My Song 1" />
      <label for="artist">歌手</label>
      <input id="artist" placeholder="My Artist" />
      <label for="album">专辑</label>
      <input id="album" placeholder="My Album" />
      <label for="themeColor">主题颜色</label>
      <input id="themeColor" value="#F05A66" />
      <label for="cubesTheme">兔兔蹦床配色</label>
      <select id="cubesTheme">
        <option value="pink">pink</option>
        <option value="purple">purple</option>
        <option value="green">green</option>
      </select>
      <label class="check"><input id="replaceExisting" type="checkbox" />替换同 ID 歌曲</label>
      <div class="hint">保存前备份歌单；同名素材会另存，原有素材保留。</div>
    </div>

    <div class="row">
      <label for="audioFile">音频文件（必选）</label>
      <input id="audioFile" type="file" accept=".mp3,.wav,.m4a,.flac,.ogg,.MP3,.WAV,.M4A,.FLAC,.OGG" />
      <label for="coverFile">封面图片（可选）</label>
      <input id="coverFile" type="file" accept=".webp,.png,.jpg,.jpeg,.WEBP,.PNG,.JPG,.JPEG" />
      <label for="lrcFile">歌词文件（可选）</label>
      <input id="lrcFile" type="file" accept=".lrc,.txt,.json,.LRC,.TXT,.JSON" />
    </div>

    <div class="row">
      <button id="saveSong" disabled>2. 保存歌曲</button>
      <div class="hint">支持 Chrome / Edge。保存后刷新播放器。</div>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <script type="module" src="/song-manager.js"></script>
  </body>
  </html>
